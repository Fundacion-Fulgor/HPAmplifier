name: Portable paths

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-portable-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reject non-portable absolute paths
        run: sh scripts/check-portable-paths.sh
      - name: Read-only fixer check
        run: python3 scripts/fix_xschem_paths.py --all --check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run tests
        run: python3 -B -m unittest discover -s tests -v
